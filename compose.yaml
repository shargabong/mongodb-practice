name: mongodb-practice

x-seed: &seed
  image: mongo:7
  depends_on:
    mongo:
      condition: service_healthy
  volumes:
    - ./stend/seed:/seed:ro
  restart: "no"
  command:
    - bash
    - -c
    - |
      count=$$(mongosh --host mongo --quiet --eval 'db.getSiblingDB("shop").orders.countDocuments()')
      if [ "$$count" != "0" ] && [ -z "$$FORCE" ]; then
        echo "Учебные базы уже загружены (shop.orders: $$count). Сброс: docker compose run --rm reset"
        exit 0
      fi
      for file in /seed/*.json; do
        name=$$(basename "$$file" .json)
        mongoimport --host mongo --db "$${name%%.*}" --collection "$${name#*.}" \
          --file "$$file" --jsonArray --drop --maintainInsertionOrder --quiet
        printf '%-22s <- %s\n' "$$name" "$$(basename "$$file")"
      done
      echo "Готово: учебные базы загружены"

x-runner: &runner
  profiles: ["tools"]
  depends_on:
    seed:
      condition: service_completed_successfully
  network_mode: "service:mongo"
  volumes:
    - .:/work
  working_dir: /work
  entrypoint: ["run"]

services:
  mongo:
    image: mongo:7
    container_name: course-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
      - "127.0.0.1:${EXPRESS_PORT:-8081}:8081"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    <<: *seed

  reset:
    <<: *seed
    profiles: ["tools"]
    environment:
      FORCE: "1"

  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      mongo:
        condition: service_healthy
    network_mode: "service:mongo"
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://127.0.0.1:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: student
      ME_CONFIG_BASICAUTH_PASSWORD: student

  python:
    <<: *runner
    build: { context: ., dockerfile: docker/python.Dockerfile }
    image: mongodb-practice/python

  ruby:
    <<: *runner
    build: { context: ., dockerfile: docker/ruby.Dockerfile }
    image: mongodb-practice/ruby
    entrypoint: ["bash", "-c", "bundle config set --local path 'vendor/bundle' && bundle install --gemfile=infra/ruby/Gemfile --quiet && exec run \"$$@\"", "--"]
  go:
    <<: *runner
    build: { context: ., dockerfile: docker/go.Dockerfile }
    image: mongodb-practice/go
    volumes:
      - .:/work
      - go-modules:/go/pkg/mod

  cpp:
    <<: *runner
    build: { context: ., dockerfile: docker/cpp.Dockerfile }
    image: mongodb-practice/cpp

  rabbitmq:
    image: rabbitmq:3-management
    container_name: course-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: course-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      retries: 3

  # sonarqube:
  #   image: sonarqube:community
  #   container_name: course-sonarqube
  #   ports:
  #     - "9001:9000"
  #   volumes:
  #     - sonar-data:/opt/sonarqube/data
  #     - sonar-extensions:/opt/sonarqube/extensions

volumes:
  mongo-data:
  go-modules:
  rabbitmq-data:
  clickhouse-data:
  # sonar-data:
  # sonar-extensions:
